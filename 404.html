<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Monier Hossam</title>
    <script>
      // GitHub Pages SPA redirect trick.
      // Stores the current path in sessionStorage, then redirects to the root.
      // The main app reads it on load and navigates to the correct route.
      // Query string + hash are preserved so gclid/UTM attribution survives.
      var path = window.location.pathname + window.location.search + window.location.hash;
      sessionStorage.setItem('ghpages_redirect', path);
      window.location.replace('/');
    </script>
  </head>
  <body></body>
</html>
